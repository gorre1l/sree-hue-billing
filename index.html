<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2C3E9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sree Hue Bill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sree Hue Billing</title>
<style>
:root{--ground:#F3F5F2;--card:#fff;--ink:#18211E;--muted:#56615C;--line:#D9DED9;--accent:#2C3E9E;--rust:#A84B31;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--ground:#121715;--card:#1C2320;--ink:#EEF2EF;--muted:#A3AEA8;--line:#33403A;--accent:#8FA2F5;--rust:#E08466;--bad:#F08A82}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px}
[hidden]{display:none!important}
main{max-width:420px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 16px 32px;display:grid;gap:16px;text-align:center}
img{width:140px;height:140px;margin:0 auto;border-radius:50%;background:#fff}
h1{margin:0;font-size:26px}
h1 i{color:var(--rust)}
p{margin:0;color:var(--muted)}
form{display:grid;gap:12px;text-align:left}
label{font-weight:700;font-size:15px;color:var(--muted)}
input[type=password],input[type=text]{width:100%;font-size:20px;padding:14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;font-size:16px}
.row input{width:24px;height:24px}
button{font-size:20px;font-weight:700;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main id="gate" hidden>
  <img src="logo.jpg" alt="Sree Hue House logo">
  <h1>Sree <i>Hue</i> House</h1>
  <p>Enter the shop password to open the bill book.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <div class="row"><input id="show" type="checkbox"><label for="show" style="font-weight:400;color:inherit">Show password</label></div>
    <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="font-weight:400;color:inherit">Remember on this phone</label></div>
    <p class="err" id="err" hidden>Wrong password. Please try again.</p>
    <button id="go" type="submit">Open</button>
  </form>
</main>

const K = "srh-key";
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function open_(key){
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(P.i)}, key, d64(P.c));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:d64(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(K); } catch(e){}
  if (saved) {
    try { const key = await crypto.subtle.importKey("raw", d64(saved), "AES-GCM", true, ["decrypt"]); await open_(key); return; }
    catch(e){ try { localStorage.removeItem(K); } catch(_){} }
  }
  document.getElementById("gate").hidden = false;
  document.getElementById("pw").focus();
})();
document.getElementById("show").onchange = e => { document.getElementById("pw").type = e.target.checked ? "text" : "password"; };
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Opening…"; err.hidden = true;
  try {
    const key = await derive(document.getElementById("pw").value.trim().toLowerCase());
    const raw = await crypto.subtle.exportKey("raw", key);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(P.i)}, key, d64(P.c));
    if (document.getElementById("keep").checked) { try { localStorage.setItem(K, e64(raw)); } catch(_){} }
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  } catch(x) {
    err.hidden = false; go.disabled = false; go.textContent = "Open";
  }
};
